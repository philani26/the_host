<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiries | Host with the Utmost Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="../images/logo-mark.jpg">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="enquiries">

<div class="admin-shell">
  <div id="shellSidebar"></div>
  <div class="admin-main">
    <div id="shellTopbar"></div>

    <div class="admin-content">
      <div style="margin-bottom:22px;">
        <h1 style="font-size:1.6rem; margin-bottom:4px;">Enquiries</h1>
        <p style="color:var(--espresso-45); margin:0;">Everyone who has reached out through the enquiry forms or WhatsApp.</p>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="toolbar">
            <div class="search-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" id="enqSearch" placeholder="Search name or trip…">
            </div>
            <select class="select-filter" id="enqStatusFilter">
              <option value="all">All statuses</option>
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="panel-body pad-0">
          <div class="table-wrap">
            <table class="admin-table">
              <thead><tr><th>Name</th><th>Trip / Interest</th><th>Travellers</th><th>Received</th><th>Status</th><th></th></tr></thead>
              <tbody id="enqTbody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="enqEmpty" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <h4>No enquiries match your filters</h4>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="enqModal">
  <div class="modal-box">
    <div class="modal-head"><h3>Enquiry Details</h3><button class="modal-close" onclick="huCloseModal('enqModal')">&times;</button></div>
    <div class="modal-body" id="enqModalBody"></div>
    <div class="modal-foot">
      <a id="enqWaLink" href="#" target="_blank" class="abtn abtn-outline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="M20.5 11.5a8.5 8.5 0 1 1-15.7-4.5L4 20l6-1.3a8.5 8.5 0 0 0 10.5-7.2z"/></svg>
        Reply on WhatsApp
      </a>
      <a id="enqEmailLink" href="#" class="abtn abtn-primary">Reply by Email</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/firestore-rest.js"></script>
<script src="../js/storage-rest.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
<script>
  let data = { enquiries: [] };
  let currentEnqId = null;

  function render(){
    const q = document.getElementById('enqSearch').value.trim().toLowerCase();
    const statusF = document.getElementById('enqStatusFilter').value;
    const rows = [...data.enquiries]
      .filter(e => (statusF==='all' || e.status===statusF) && (!q || e.name.toLowerCase().includes(q) || (e.trip||'').toLowerCase().includes(q)))
      .sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

    document.getElementById('enqEmpty').style.display = rows.length ? 'none' : 'block';
    document.getElementById('enqTbody').innerHTML = rows.map(e => `
      <tr data-id="${e.id}" style="cursor:pointer;">
        <td><div class="row-title-main">${e.name}</div><div class="row-title-sub">${e.email}</div></td>
        <td>${e.trip || '—'}</td>
        <td>${e.travellers || '—'}</td>
        <td>${huFmtDateTime(e.createdAt)}</td>
        <td><span class="status-pill ${e.status}">${e.status}</span></td>
        <td>
          <div class="row-actions">
            <button title="Delete" class="danger" data-action="delete" data-id="${e.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  document.getElementById('enqSearch').addEventListener('input', render);
  document.getElementById('enqStatusFilter').addEventListener('change', render);

  document.getElementById('enqTbody').addEventListener('click', async (e) => {
    const delBtn = e.target.closest('[data-action="delete"]');
    if (delBtn){
      if (!(await huConfirm('Delete this enquiry?'))) return;
      await huDeleteEnquiry(delBtn.dataset.id);
      data.enquiries = data.enquiries.filter(x => x.id !== delBtn.dataset.id);
      huToast('Enquiry deleted'); render();
      return;
    }
    const row = e.target.closest('tr[data-id]');
    if (row) openEnquiry(row.dataset.id);
  });

  function openEnquiry(id){
    currentEnqId = id;
    const en = data.enquiries.find(x => x.id === id);
    document.getElementById('enqModalBody').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
        <div>
          <div style="font-family:var(--font-display); font-size:1.2rem;">${en.name}</div>
          <div style="font-size:13px; color:var(--espresso-45);">${en.email} · ${en.whatsapp||'—'}</div>
        </div>
        <select id="enqStatusSelect" class="select-filter">
          <option value="new" ${en.status==='new'?'selected':''}>New</option>
          <option value="contacted" ${en.status==='contacted'?'selected':''}>Contacted</option>
          <option value="closed" ${en.status==='closed'?'selected':''}>Closed</option>
        </select>
      </div>
      <div class="aform-grid" style="margin-bottom:14px;">
        <div><div style="font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--espresso-45);">Trip / Interest</div><div>${en.trip || '—'}</div></div>
        <div><div style="font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--espresso-45);">Travellers</div><div>${en.travellers || '—'}</div></div>
        <div><div style="font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--espresso-45);">Preferred Dates</div><div>${en.dates || '—'}</div></div>
        <div><div style="font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--espresso-45);">Received</div><div>${huFmtDateTime(en.createdAt)}</div></div>
      </div>
      ${en.message ? `<div><div style="font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--espresso-45); margin-bottom:4px;">Message</div><p style="margin:0; color:var(--espresso-70);">${en.message}</p></div>` : ''}
    `;
    document.getElementById('enqStatusSelect').addEventListener('change', async (e) => {
      await huSetEnquiryStatus(en.id, e.target.value);
      en.status = e.target.value; render();
    });
    document.getElementById('enqWaLink').href = `https://wa.me/${(en.whatsapp||'').replace(/[^0-9]/g,'')}`;
    document.getElementById('enqEmailLink').href = `mailto:${en.email}`;
    huOpenModal('enqModal');
  }

  (async () => {
    await huRequireAuth();
    huRenderShell('enquiries', '<span class="cur">Enquiries</span>');
    data = await huFetchAll();
    huUpdateNavCounts(data);
    render();
  })();
</script>
</body>
</html>
