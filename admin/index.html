<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Host with the Utmost Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="../images/logo-mark.jpg">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="login">

<div class="login-shell">
  <div class="login-visual">
    <img src="../images/hero-home.jpg" alt="">
    <div class="login-visual-content">
      <span class="script">A soft place to land</span>
      <h2 style="color:#fff; font-size:1.9rem; max-width:380px; margin-top:10px;">Manage trips, testimonials and galleries — all from one calm dashboard.</h2>
    </div>
  </div>

  <div class="login-form-col">
    <div class="login-card">
      <span class="brand-mark"><img src="../images/logo-mark.jpg" alt="The Host with the Utmost logo"></span>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to manage The Host with the Utmost website.</p>

      <form id="loginForm">
        <div class="afield" style="margin-bottom:16px;">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" value="promise@hostwiththeutmost.com" required>
        </div>
        <div class="afield" style="margin-bottom:8px;">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass" placeholder="Enter your password" required>
        </div>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:var(--espresso-70); margin:14px 0 22px;">
          <input type="checkbox" checked style="width:15px;height:15px;"> Keep me signed in
        </label>
        <div id="loginError" style="display:none; background:#FBEAE7; color:#B4382C; padding:12px 14px; border-radius:10px; font-size:13px; margin-bottom:16px;"></div>
        <button type="submit" class="abtn abtn-primary" id="loginSubmit" style="width:100%; justify-content:center; padding:13px;">
          Sign In
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <div class="login-note">
        Signed in as the site admin. Contact the site owner if you need your password reset.
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/firestore-rest.js"></script>
<script src="../js/storage-rest.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
<script>
  auth.onAuthStateChanged(user => { if (user) location.href = 'dashboard.html'; });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginSubmit');
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    btn.disabled = true;
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value;
    const result = await huLogin(email, password);
    if (result.ok){
      location.href = 'dashboard.html';
    } else {
      errEl.textContent = result.error || 'Could not sign in. Check your email and password.';
      errEl.style.display = 'block';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
