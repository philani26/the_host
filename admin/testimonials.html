<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testimonials | Host with the Utmost Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="../images/logo-mark.jpg">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="testimonials">

<div class="admin-shell">
  <div id="shellSidebar"></div>
  <div class="admin-main">
    <div id="shellTopbar"></div>

    <div class="admin-content">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px;">
        <div>
          <h1 style="font-size:1.6rem; margin-bottom:4px;">Testimonials</h1>
          <p style="color:var(--espresso-45); margin:0;">Drag <svg style="width:13px;height:13px;vertical-align:-2px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg> to reorder how they appear on the site.</p>
        </div>
        <button class="abtn abtn-primary" id="addTestiBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add Testimonial
        </button>
      </div>

      <div class="panel">
        <div class="panel-body pad-0" id="testiList"></div>
        <div class="empty-state" id="testiEmpty" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>
          <h4>No testimonials yet</h4>
          <p>Add your first one to build trust on the homepage and About page.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit modal -->
<div class="modal-overlay" id="testiModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="testiModalTitle">Add Testimonial</h3>
      <button class="modal-close" onclick="huCloseModal('testiModal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="testiForm">
        <input type="hidden" id="tId">
        <div class="afield" style="margin-bottom:16px;">
          <label for="tText">Review Text</label>
          <textarea id="tText" required placeholder="What did they say about their trip?"></textarea>
        </div>
        <div class="aform-grid">
          <div class="afield"><label for="tName">Name</label><input type="text" id="tName" required placeholder="e.g. Kayleen M."></div>
          <div class="afield"><label for="tLoc">Destination / Date</label><input type="text" id="tLoc" required placeholder="e.g. Zanzibar Trip, 2025"></div>
          <div class="afield">
            <label for="tRating">Rating</label>
            <select id="tRating"><option value="5">★★★★★ (5)</option><option value="4">★★★★☆ (4)</option><option value="3">★★★☆☆ (3)</option></select>
          </div>
          <div class="afield">
            <label for="tStatus">Status</label>
            <select id="tStatus"><option value="published">Published</option><option value="draft">Draft</option></select>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="abtn abtn-outline" onclick="huCloseModal('testiModal')">Cancel</button>
      <button class="abtn abtn-primary" id="testiSaveBtn">Save Testimonial</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
<script>
  let data = { testimonials: [] };

  function stars(n){ return '★'.repeat(n) + '☆'.repeat(5-n); }

  function render(){
    const list = [...data.testimonials].sort((a,b)=>a.order-b.order);
    document.getElementById('testiEmpty').style.display = list.length ? 'none' : 'block';
    document.getElementById('testiList').innerHTML = list.map(t => `
      <div class="testi-manage-card" draggable="true" data-id="${t.id}">
        <span class="drag-handle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg></span>
        <img src="${huImg(t.avatar)}" alt="" style="width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;">
        <div class="tm-body">
          <div class="tm-stars">${stars(t.rating)}</div>
          <p class="tm-text">"${t.text}"</p>
          <div class="tm-meta">${t.name} · ${t.location} · <span class="status-pill ${t.status}" style="transform:translateY(-1px); display:inline-flex;">${t.status}</span></div>
        </div>
        <div class="row-actions">
          <button title="Edit" data-action="edit" data-id="${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button title="Delete" class="danger" data-action="delete" data-id="${t.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>
      </div>`).join('');
    bindDrag();
  }

  document.getElementById('testiList').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === 'delete'){
      if (!huConfirm('Delete this testimonial?')) return;
      await huDeleteTestimonial(id);
      data.testimonials = data.testimonials.filter(t => t.id !== id);
      huToast('Testimonial deleted'); render();
      return;
    }
    if (btn.dataset.action === 'edit') openModal(data.testimonials.find(t => t.id === id));
  });

  function openModal(t){
    document.getElementById('testiModalTitle').textContent = t ? 'Edit Testimonial' : 'Add Testimonial';
    document.getElementById('tId').value = t ? t.id : '';
    document.getElementById('tText').value = t ? t.text : '';
    document.getElementById('tName').value = t ? t.name : '';
    document.getElementById('tLoc').value = t ? t.location : '';
    document.getElementById('tRating').value = t ? t.rating : 5;
    document.getElementById('tStatus').value = t ? t.status : 'published';
    huOpenModal('testiModal');
  }

  document.getElementById('addTestiBtn').addEventListener('click', () => openModal(null));

  document.getElementById('testiSaveBtn').addEventListener('click', async () => {
    if (!document.getElementById('testiForm').reportValidity()) return;
    const id = document.getElementById('tId').value;
    const payload = {
      text: document.getElementById('tText').value.trim(),
      name: document.getElementById('tName').value.trim(),
      location: document.getElementById('tLoc').value.trim(),
      rating: Number(document.getElementById('tRating').value),
      status: document.getElementById('tStatus').value
    };
    if (id){
      await huSaveTestimonial(id, payload);
      Object.assign(data.testimonials.find(t => t.id === id), payload);
      huToast('Testimonial updated');
    } else {
      const maxOrder = Math.max(0, ...data.testimonials.map(t=>t.order));
      const newDoc = { order: maxOrder+1, avatar:'images/17.jpeg', ...payload };
      const newId = await huSaveTestimonial(null, newDoc);
      data.testimonials.push({ id: newId, ...newDoc });
      huToast('Testimonial added');
    }
    huCloseModal('testiModal');
    render();
  });

  /* Drag to reorder */
  let dragId = null;
  function bindDrag(){
    const cards = document.querySelectorAll('.testi-manage-card');
    cards.forEach(card => {
      card.addEventListener('dragstart', () => { dragId = card.dataset.id; card.classList.add('dragging'); });
      card.addEventListener('dragend', () => { card.classList.remove('dragging'); });
      card.addEventListener('dragover', (e) => e.preventDefault());
      card.addEventListener('drop', async (e) => {
        e.preventDefault();
        const targetId = card.dataset.id;
        if (targetId === dragId) return;
        const list = [...data.testimonials].sort((a,b)=>a.order-b.order);
        const dragged = list.find(t=>t.id===dragId);
        const from = list.indexOf(dragged);
        const to = list.findIndex(t=>t.id===targetId);
        list.splice(from,1); list.splice(to,0,dragged);
        list.forEach((t,i)=>t.order=i+1);
        await huReorderTestimonials(list.map(t => t.id));
        render();
      });
    });
  }

  (async () => {
    await huRequireAuth();
    huRenderShell('testimonials', '<span class="cur">Testimonials</span>');
    data = await huFetchAll();
    huUpdateNavCounts(data);
    render();
  })();
</script>
</body>
</html>
