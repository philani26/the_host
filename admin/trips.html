<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trips | Host with the Utmost Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/jpeg" href="../images/logo-mark.jpg">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body" data-page="trips">

<div class="admin-shell">
  <div id="shellSidebar"></div>
  <div class="admin-main">
    <div id="shellTopbar"></div>

    <div class="admin-content">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:14px;">
        <div>
          <h1 style="font-size:1.6rem; margin-bottom:4px;">Trips</h1>
          <p style="color:var(--espresso-45); margin:0;">Add, edit, publish or archive your curated trips.</p>
        </div>
        <a href="trip-form.html" class="abtn abtn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add New Trip
        </a>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="toolbar">
            <div class="search-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="text" id="tripSearch" placeholder="Search destinations…">
            </div>
            <select class="select-filter" id="tripStatusFilter">
              <option value="all">All statuses</option>
              <option value="published">Published</option>
              <option value="draft">Draft</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div id="bulkBar" style="display:none; gap:8px;" class="toolbar">
            <span style="font-size:13px; color:var(--espresso-45);"><span id="bulkCount">0</span> selected</span>
            <button class="abtn abtn-outline" id="bulkPublish">Publish</button>
            <button class="abtn abtn-outline" id="bulkArchive">Archive</button>
            <button class="abtn abtn-danger" id="bulkDelete">Delete</button>
          </div>
        </div>
        <div class="panel-body pad-0">
          <div class="table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th class="cell-checkbox"><input type="checkbox" id="selectAll"></th>
                  <th>Destination</th>
                  <th>Dates</th>
                  <th>Price</th>
                  <th>Deposit</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tripsTbody"></tbody>
            </table>
          </div>
          <div class="empty-state" id="tripsEmpty" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l18-7-7 18-2-8-8-2z"/></svg>
            <h4>No trips match your filters</h4>
            <p>Try clearing your search or status filter.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="../js/firestore-rest.js"></script>
<script src="../js/storage-rest.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
<script>
  let data = { trips: [] };
  let selected = new Set();

  function statusActions(t){
    const acts = [];
    if (t.status !== 'published') acts.push({label:'Publish', status:'published'});
    if (t.status !== 'draft') acts.push({label:'Move to Draft', status:'draft'});
    if (t.status !== 'archived') acts.push({label:'Archive', status:'archived'});
    return acts;
  }

  function render(){
    const q = document.getElementById('tripSearch').value.trim().toLowerCase();
    const statusF = document.getElementById('tripStatusFilter').value;
    const rows = data.trips.filter(t =>
      (statusF === 'all' || t.status === statusF) &&
      (!q || t.destination.toLowerCase().includes(q) || t.tagline.toLowerCase().includes(q))
    );

    document.getElementById('tripsTbody').innerHTML = rows.map(t => `
      <tr data-id="${t.id}">
        <td class="cell-checkbox"><input type="checkbox" class="rowCheck" data-id="${t.id}" ${selected.has(t.id)?'checked':''}></td>
        <td>
          <div class="row-title-cell">
            <img class="row-thumb" src="${huImg(t.hero)}" alt="">
            <div><div class="row-title-main">${t.destination}</div><div class="row-title-sub">${t.tagline}</div></div>
          </div>
        </td>
        <td>${huFmtDateRange(t.dateStart, t.dateEnd)}</td>
        <td>${huFmtCurrency(t.price)}</td>
        <td>${huFmtCurrency(t.deposit)}</td>
        <td><span class="status-pill ${t.status}">${t.status}</span></td>
        <td>
          <div class="row-actions">
            ${statusActions(t).map(a => `<button title="${a.label}" data-action="status" data-status="${a.status}" data-id="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 6L9 17l-5-5"/></svg>
            </button>`).join('')}
            <button title="Edit" data-action="edit" data-id="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <button title="Delete" class="danger" data-action="delete" data-id="${t.id}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
            </button>
          </div>
        </td>
      </tr>`).join('');

    document.getElementById('tripsEmpty').style.display = rows.length ? 'none' : 'block';
    document.querySelector('.table-wrap').style.display = rows.length ? '' : 'none';
    updateBulkBar();
  }

  function updateBulkBar(){
    const bar = document.getElementById('bulkBar');
    bar.style.display = selected.size ? 'flex' : 'none';
    document.getElementById('bulkCount').textContent = selected.size;
  }

  document.getElementById('tripSearch').addEventListener('input', render);
  document.getElementById('tripStatusFilter').addEventListener('change', render);

  document.getElementById('selectAll').addEventListener('change', (e) => {
    document.querySelectorAll('.rowCheck').forEach(cb => { cb.checked = e.target.checked; });
    selected = e.target.checked ? new Set(data.trips.map(t=>t.id)) : new Set();
    updateBulkBar();
  });

  document.getElementById('tripsTbody').addEventListener('change', (e) => {
    if (e.target.classList.contains('rowCheck')){
      const id = e.target.dataset.id;
      e.target.checked ? selected.add(id) : selected.delete(id);
      updateBulkBar();
    }
  });

  document.getElementById('tripsTbody').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if (action === 'edit'){ location.href = `trip-form.html?id=${id}`; return; }
    if (action === 'delete'){
      if (!(await huConfirm('Delete this trip permanently? This cannot be undone.'))) return;
      await huDeleteTrip(id);
      data.trips = data.trips.filter(t => t.id !== id);
      huToast('Trip deleted'); render();
      return;
    }
    if (action === 'status'){
      const t = data.trips.find(t => t.id === id);
      await huSetTripStatus(id, btn.dataset.status);
      t.status = btn.dataset.status;
      huToast(`${t.destination} marked as ${t.status}`);
      render();
    }
  });

  document.getElementById('bulkPublish').addEventListener('click', async () => {
    await Promise.all([...selected].map(id => huSetTripStatus(id, 'published')));
    data.trips.forEach(t => { if (selected.has(t.id)) t.status = 'published'; });
    huToast('Selected trips published'); selected.clear(); render();
  });
  document.getElementById('bulkArchive').addEventListener('click', async () => {
    await Promise.all([...selected].map(id => huSetTripStatus(id, 'archived')));
    data.trips.forEach(t => { if (selected.has(t.id)) t.status = 'archived'; });
    huToast('Selected trips archived'); selected.clear(); render();
  });
  document.getElementById('bulkDelete').addEventListener('click', async () => {
    if (!(await huConfirm(`Delete ${selected.size} trip(s) permanently?`))) return;
    await Promise.all([...selected].map(id => huDeleteTrip(id)));
    data.trips = data.trips.filter(t => !selected.has(t.id));
    huToast('Selected trips deleted'); selected.clear(); render();
  });

  (async () => {
    await huRequireAuth();
    huRenderShell('trips', '<span class="cur">Trips</span>');
    data = await huFetchAll();
    huUpdateNavCounts(data);
    render();
  })();
</script>
</body>
</html>
